name: Build GhostHome Provisioning SD Image

# First-boot provisioning image for GhostHome (Pi 5). Bakes
# `?ref=ghosthome-ready-<shortRev>` into the closure and embeds the
# same shortRev in the filename so an operator can grep downloaded
# artifacts by ref. After flashing, the operator pushes a branch/tag
# named exactly `ghosthome-ready-<shortRev>` pointing at the commit
# they want the new Pi to switch into; the image's first-boot timer
# picks it up on the next retry. See the comment block in flake.nix
# above `GhostHome-provisioning-sdImage` for the full workflow.
#
# Manual trigger only: each image bakes the *commit it was built
# from* and is only useful for a Pi being freshly flashed with that
# image. Building on every push would produce unique images per
# commit but burn ~5-10 min of CI on each — over-aggressive for a
# personal repo where most commits never lead to a flash.
on:
  workflow_dispatch:

jobs:
  build-sd-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            extra-platforms = aarch64-linux
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://cache.nixos.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build provisioning SD card image
        run: |
          IMG_PATH=$(nix build \
            '.#Machines-PhysicalServers-GhostHome-provisioning-sdImage' \
            --no-link --print-out-paths \
            --option system-features "big-parallel")
          echo "img_path=$IMG_PATH" >> "$GITHUB_ENV"

      - name: Prepare artifact
        run: |
          IMG_FILE=$(find "${{ env.img_path }}" -name "*.img.zst" -type f | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "No .img.zst file found in ${{ env.img_path }}"
            ls -laR "${{ env.img_path }}"
            exit 1
          fi
          IMG_NAME=$(basename "$IMG_FILE")
          cp "$IMG_FILE" "$IMG_NAME"
          echo "img_name=$IMG_NAME" >> "$GITHUB_ENV"
          ls -lh "$IMG_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ghosthome-provisioning-sdimage
          path: ${{ env.img_name }}
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.img_name }}

name: Build PrintScanServerPi4 Provisioning SD Image

# First-boot provisioning image for PrintScanServerPi4. Same self-
# flip pattern as the GhostHome provisioning image, just targeting
# the Pi 4 hardware module + the PrintScanServerPi4 nixosConfig:
# bakes `?ref=printscan-ready-<shortRev>` into the closure and
# embeds the same shortRev (with parens around the `ref=value`
# form) in the filename. Operator pushes
# `printscan-ready-<shortRev>` once secrets are encrypted to the
# new Pi's host age key and the image self-flips on next retry.
#
# Manual trigger only: each image bakes the *commit it was built
# from* and is only useful for a Pi being freshly flashed with that
# image. Building on every push would produce unique images per
# commit but burn ~5-10 min of CI on each — over-aggressive for a
# personal repo where most commits never lead to a flash.
on:
  workflow_dispatch:

jobs:
  build-sd-image:
    # Native aarch64 — no QEMU. GitHub's `ubuntu-24.04-arm` is
    # free for public repos and runs Linux kernel + nix builds
    # at native speed; the alternative (x86_64 runner + qemu-user
    # binfmt) timed out at 2h+ when the Pi-vendor kernel had to
    # rebuild under emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://cache.nixos.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Build provisioning SD card image
        run: |
          IMG_PATH=$(nix build \
            '.#Machines-PhysicalServers-PrintScanServerPi4-provisioning-sdImage' \
            --no-link --print-out-paths \
            --option system-features "big-parallel")
          echo "img_path=$IMG_PATH" >> "$GITHUB_ENV"

      - name: Prepare artifact
        run: |
          IMG_FILE=$(find "${{ env.img_path }}" -name "*.img.zst" -type f | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "No .img.zst file found in ${{ env.img_path }}"
            ls -laR "${{ env.img_path }}"
            exit 1
          fi
          IMG_NAME=$(basename "$IMG_FILE")
          cp "$IMG_FILE" "$IMG_NAME"
          # Artifact bundle name carries the ref-bearing stem so
          # the GitHub UI shows the readiness ref directly in the
          # artifact list. GitHub wraps a downloaded artifact as
          # `<name>.zip`; stripping the .img.zst extension off the
          # filename for the artifact name avoids a `.img.zst.zip`
          # double-extension. Inside the zip the real .img.zst
          # filename is unchanged.
          echo "img_name=$IMG_NAME" >> "$GITHUB_ENV"
          echo "artifact_name=${IMG_NAME%.img.zst}" >> "$GITHUB_ENV"
          ls -lh "$IMG_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.img_name }}
          retention-days: 30
          # The payload is already zstd-compressed (.img.zst). Skip
          # the artifact-API's second compression pass — it spends
          # minutes recompressing already-compressed bytes for zero
          # size benefit. `compression-level: 0` produces a STORED
          # zip (thin wrapper, no recompression). The wrapper
          # itself is unavoidable: actions/upload-artifact always
          # zip-wraps, that's how GitHub's artifact storage works.
          compression-level: 0

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.img_name }}

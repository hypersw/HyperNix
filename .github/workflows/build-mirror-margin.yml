name: Build Mirror Margin portable ZIP

on:
  push:
    paths:
      - "Modules/Programs/MirrorMargin/**"
      - "flake.lock"
  pull_request:
    paths:
      - "Modules/Programs/MirrorMargin/**"
      - "flake.lock"
  workflow_dispatch:

jobs:
  build-portable-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build portable ZIP
        run: |
          ZIP_PATH=$(nix build .#Modules-Programs-MirrorMargin.portableZip --no-link --print-out-paths)
          cp "$ZIP_PATH" mirror-margin-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mirror-margin-portable
          path: mirror-margin-portable.zip
          retention-days: 30
          compression-level: 0

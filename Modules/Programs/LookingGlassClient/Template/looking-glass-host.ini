; ─────────────────────────────────────────────────────────────────────
; looking-glass-host.ini — Looking Glass HOST service config.
;
; Path in the guest (Windows):
;   C:\ProgramData\Looking Glass (host)\looking-glass-host.ini
;
; The directory is created by the LG Host installer; this file is NOT,
; you create it. Notepad as Administrator (to save into ProgramData)
; → paste this content → Save As → "All Files" filter → filename
; looking-glass-host.ini → restart the "Looking Glass (host)" service
; via services.msc. Defaults are baked into the binary; this file
; only overrides them.
;
; FILL IN BEFORE FIRST USE
;   - [d12] / [dxgi] `adapter=` — a case-sensitive substring of your
;     GPU's adapter description as Windows reports it (LG matches via
;     wcsstr). Run `dxdiag` → Displays tab in the guest to see the
;     exact strings. "NVIDIA" matches any NVIDIA card, "Intel"
;     matches the iGPU, etc; use a more specific substring (e.g.
;     "GTX 1660") if multiple cards of the same brand are present.
;     Choosing by adapter description is stable across driver
;     reinstalls and display reordering; choosing by
;     `output=\\.\DISPLAYn` is NOT — those numbers shuffle when
;     QXL/VDD are toggled.
; ─────────────────────────────────────────────────────────────────────

[app]
; Capture method preference. d12 (D3D12) is the modern path —
; lower hold-time on the swapchain, slightly faster steady-state.
; If d12 init fails for any reason, LG falls back to DXGI Output
; Duplication automatically (don't force this unless you want the
; fallback disabled and a louder failure).
;capture=d12

[d12]
; Substring match against the WDDM adapter description. Pin to the
; GPU you actually want LG to capture from. With VDD present and a
; passed-through GPU, this should be the passthrough GPU — VDD's
; virtual monitor will be rendered by it anyway.
adapter=NVIDIA

; Parallel copy contexts for D12 capture. Default 1; 2 trims a
; small amount of per-frame overhead on multi-core hosts (your
; Zen 4 box won't notice the CPU cost).
copyBackendCount=2

; Dirty-rectangle tracking: send only changed regions of the frame
; instead of the whole surface every time. Significant win for
; desktop work where most pixels are static frame-to-frame.
; Negligible cost when scenes are mostly dynamic (e.g. games), so
; on by default everywhere.
trackDamage=yes

[dxgi]
; Mirror the adapter pin onto the DXGI fallback path. If LG falls
; back from D12 → DXGI, you still want it pinned to the right GPU.
adapter=NVIDIA

; Intentionally NOT setting `output=` — let LG auto-pick the first
; active output on the adapter. The DISPLAY-N index is unstable;
; auto-pick + a single active output on the chosen adapter is
; stable and self-correcting.

; ─────────────────────────────────────────────────────────────────────
; Other knobs worth knowing (uncomment to use):
;
; [audio]
;   audioDev=Pulse      ; audio capture/playback backend
;
; [os]
;   logDir=C:\path\to\logs
;
; [d12]
;   debug=no            ; D3D12 debug layer; only enable when
;                       ; debugging a capture failure, very chatty
;
; For the full list, run `looking-glass-host.exe --help` in a
; PowerShell as Administrator inside the guest.
; ─────────────────────────────────────────────────────────────────────
